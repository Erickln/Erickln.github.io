<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colección de Juegos de Mesa</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Colección de Juegos de Mesa</h1>
        
        <div class="filters-container">
            <h2>Filtros</h2>
            <div class="filters">
                <div class="filter-group">
                    <label>Rank</label>
                    <div class="filter-row">
                        <select id="filter-rank-op" class="filter-operator">
                            <option value=">=">&gt;=</option>
                            <option value="<=">&lt;=</option>
                            <option value="=">=</option>
                        </select>
                        <input type="number" id="filter-rank" placeholder="Valor" class="filter-input">
                    </div>
                </div>
                <div class="filter-group">
                    <label>Complejidad</label>
                    <div class="filter-row">
                        <select id="filter-complejidad-op" class="filter-operator">
                            <option value=">=">&gt;=</option>
                            <option value="<=">&lt;=</option>
                            <option value="=">=</option>
                        </select>
                        <input type="number" step="0.01" id="filter-complejidad" placeholder="Valor" class="filter-input">
                    </div>
                </div>
                <div class="filter-group">
                    <label>Min Jugadores</label>
                    <div class="filter-row">
                        <select id="filter-minplayers-op" class="filter-operator">
                            <option value=">=">&gt;=</option>
                            <option value="<=">&lt;=</option>
                            <option value="=">=</option>
                        </select>
                        <input type="number" id="filter-minplayers" placeholder="Valor" class="filter-input">
                    </div>
                </div>
                <div class="filter-group">
                    <label>Max Jugadores</label>
                    <div class="filter-row">
                        <select id="filter-maxplayers-op" class="filter-operator">
                            <option value=">=">&gt;=</option>
                            <option value="<=">&lt;=</option>
                            <option value="=">=</option>
                        </select>
                        <input type="number" id="filter-maxplayers" placeholder="Valor" class="filter-input">
                    </div>
                </div>
                <div class="filter-group">
                    <label>Max Tiempo</label>
                    <div class="filter-row">
                        <select id="filter-maxplaytime-op" class="filter-operator">
                            <option value=">=">&gt;=</option>
                            <option value="<=">&lt;=</option>
                            <option value="=">=</option>
                        </select>
                        <input type="number" id="filter-maxplaytime" placeholder="Valor" class="filter-input">
                    </div>
                </div>
                <div class="filter-group">
                    <label>Categoría</label>
                    <input type="text" id="filter-categoria" placeholder="Filtrar por Categoría" class="filter-input filter-full">
                </div>
                <button id="clear-filters" class="btn-clear">Limpiar Filtros</button>
            </div>
        </div>

        <div class="table-container">
            <table id="games-table">
                <thead>
                    <tr>
                        <th>Caja</th>
                        <th>Juego</th>
                        <th>Rank</th>
                        <th>Complejidad</th>
                        <th>¿De qué trata?</th>
                        <th>Calificación Público</th>
                        <th>Recomm Players</th>
                        <th>Max Players</th>
                        <th>Min Playtime</th>
                        <th>Max Playtime</th>
                        <th>Min Players</th>
                        <th>Categoría Principal</th>
                    </tr>
                </thead>
                <tbody id="games-tbody">
                    <!-- Los datos se cargarán dinámicamente con JavaScript -->
                </tbody>
            </table>
        </div>

        <div id="no-results" class="no-results" style="display: none;">
            No se encontraron juegos con los filtros aplicados.
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
